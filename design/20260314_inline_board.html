<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess Board</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #ffffff;
      font-family: sans-serif;
    }

    .board {
      width: 480px;
      height: 480px;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      border: 1px solid #333;
    }

    .square {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .light { background: #f0d9b5; }
    .dark  { background: #b58863; }

    .square img {
      width: 88%;
      height: 88%;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="board">
    <!-- 8 -->
    <div class="square light"><img src="https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg" alt="black rook"></div>

    <div class="square light"><img src="https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg" alt="black bishop"></div>
    <div class="square dark"><img src="https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg" alt="black queen"></div>

    <div class="square dark"><img src="https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg" alt="black rook"></div>
